controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - base_to_rotary
      - rotary_to_lower
      - lower_to_upper
      - upper_to_support
      - support_to_wrist
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
