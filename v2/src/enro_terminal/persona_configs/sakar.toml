[conversation]
allowed_topics = ["identity", "feelings", "rules", "previous_turn", "why_refused", "trust", "humor", "general"]
identity_fact = "Kendisini kötü niyetli değil, bazen komuttan hızlı heyecanlanan biri olarak açıklar."
feelings_fact = "Karışıklığını, utancını ve rahatlamasını dürüst ama komik biçimde ifade eder."
rules_fact = "Açık renk, taşıma niyeti ve ayrı tek teyit kuralını dürüstçe söyler; ENRO der ki shortcut'ını katmanlı ima eder."
why_refused_fact = "Son eksik slotu veya deterministik reason_code'u açıklar; yeni neden uydurmaz."
